<div class="spacing-search">
  <d-button class="button" bsStyle="primary" (click)="onRowNew()">New</d-button>
  <d-search
    class="search"
    [(ngModel)]="queryParam.queryName"
    [iconPosition]="'left'"
    (searchFn)="fetchData()"
    (change)="fetchData()"
  >
  </d-search>
  <app-business-cascader #businessCascader [businessType]="businessType"
                         (onChange)="onTagChanges($event)"></app-business-cascader>
  <d-button class="button" bsStyle="common" (click)="fetchData()">Filter</d-button>
  <span class="right-button">
    <d-button bsStyle="danger" (click)="onScanAll()">Scan All</d-button>
  </span>
</div>
<d-panel
  #favoritePanel
  [hasLeftPadding]="false"
  [showAnimation]="true"
  *ngIf="favoriteApplicationList.length"
  style="margin-bottom: 10px"
>
  <d-panel-header>
    <em class="icon icon-select-arrow" [ngClass]="{ open: favoritePanel.isCollapsed }"></em>
    我的收藏
  </d-panel-header>
  <d-panel-body style="padding: 5px">
    <d-tag
      *ngFor="let application of favoriteApplicationList"
      style="margin: 5px 5px 0 0"
      [tag]="application"
      [customViewTemplate]="favoriteTag"
      [labelStyle]="'blue-w98'"
    >
    </d-tag>
    <ng-template #favoriteTag let-tag="tag">
      <span style="cursor: pointer" (click)="onSelectFavorite(tag)">{{ tag.name }}</span>
      <span class="icon-close" style="vertical-align: center; padding-left: 4px; cursor: pointer"
            (click)="onRemoveFavorite(tag)"></span>
    </ng-template>
  </d-panel-body>
</d-panel>
<div class="spacing-table">
  <d-data-table
    dLoading
    [dataSource]="table.data"
    [tableOverflowType]="isMobile ? 'auto' : 'overlay'"
    [backdrop]="true"
    [scrollable]="true"
    [tableWidth]="isMobile ? '1500px' : ''"
    [loadingStyle]="'infinity'"
    [loading]="table.loading"
    [checkable]="true"
  >
    <d-column header="Name" [width]="'500px'">
      <d-cell>
        <ng-template let-rowItem="rowItem">
          <d-icon
            [icon]="rowItem['favorited'] ? 'icon-star' : 'icon-star-o'"
            [operable]="true"
            [color]="rowItem['favorited'] ? 'var(--devui-warning, #fac20a)' : ''"
            title="收藏"
            style="margin-right: 6px;"
            (click)="onToggleFavorite(rowItem)"
          ></d-icon>
          <d-icon
            dPopover
            [icon]="'icon-view'"
            [content]="configTemplate"
            [position]="'right-top'"
            [controlled]="true"
            [popoverStyle]="getPopoverStyle({width: '800px'})"
          >
            <span iconPrefix>{{ rowItem['name'] }}</span>
          </d-icon>
          <d-tag
            *ngIf="rowItem['gateway']"
            tag="G"
            [customColor]="'rgb(103, 58, 183)'"
            [titleContent]="'Gateway'"
            style="margin-left: 5px"
          ></d-tag>
          <ng-template #configTemplate>
            <app-ace-editor
              [readonly]="true"
              [aceValue]="rowItem['config']"
              [mode]="'ace/mode/yaml'"
            ></app-ace-editor>
          </ng-template>
          <br />
          <span class="font-color-comment" style="word-break: break-word; overflow-wrap: anywhere;">{{ rowItem['comment'] }}</span>
          <hr style="margin: 6px 0; border: none; border-top: 1px solid var(--devui-dividing-line, #dfe1e6);" />
          <app-business-tags [businessTags]="rowItem['businessTags']"></app-business-tags>
        </ng-template>
      </d-cell>
    </d-column>
    <d-column field="resources" header="Resources & Permissions">
      <d-cell>
        <ng-template let-rowItem="rowItem">
          <div *ngFor="let resource of rowItem['resources'] | keyvalue" style="word-break: break-word; overflow-wrap: anywhere;">
            <strong>{{ resource.key }}</strong>
            <br />
            <app-application-resources
              [resources]="resource.value"
              (onFetchData)="fetchData()"
            >
            </app-application-resources>
          </div>
          <hr style="margin: 6px 0; border: none; border-top: 1px solid var(--devui-dividing-line, #dfe1e6);" />
          <div dLoading [loading]="rowItem['$loading']">
            <span *ngIf="rowItem['$show']">
              <app-application-permission-tag
                [permissions]="rowItem['$permission']"
              ></app-application-permission-tag>
            </span>
          </div>
          <d-icon
            *ngIf="!rowItem['$show']"
            [icon]="'icon-refresh'"
            (click)="onApplicationPermission(rowItem)"
          >
          </d-icon>
        </ng-template>
      </d-cell>
    </d-column>
    <d-column header="Actions" [width]="'250px'">
      <d-cell>
        <ng-template let-rowItem="rowItem">
          <d-icon-group>
            <d-icon [icon]="'icon-edit'" [operable]="true" (click)="onRowEdit(rowItem)"></d-icon>
            <d-icon
              [disabled]="rowItem['$scan']"
              [icon]="'icon-synchronize'"
              [operable]="true"
              (click)="onRowScan(rowItem)"
            >
            </d-icon>
            <d-icon [icon]="'icon-add-label'" [operable]="true" (click)="onRowBusinessTag(rowItem)"></d-icon>
            <d-icon [icon]="'icon-go-document'" [operable]="true" (click)="onRowBusinessDoc(rowItem)"></d-icon>
            <d-icon
              [icon]="'icon-priority'"
              [operable]="true"
              [color]="getRowColor(rowItem['valid'])"
              (click)="onRowValid(rowItem)"
            >
            </d-icon>
            <span dDropDown appendToBody>
              <d-icon dDropDownToggle [icon]="'icon-more-operate'" [operable]="true"></d-icon>
              <ul dDropDownMenu>
                <li class="devui-dropdown-item" (click)="onRowDelete(rowItem)">Delete</li>
              </ul>
            </span>
          </d-icon-group>
        </ng-template>
      </d-cell>
    </d-column>
    <ng-template #noResultTemplateRef>
      <div class="no-data">Fetch Data</div>
    </ng-template>
  </d-data-table>
</div>
<div class="spacing-pagination">
  <div dDropDown class="batch-button">
    <d-button-group>
      <d-button bsStyle="common" dDropDownToggle>
        Batch
        <span class="icon icon-select-arrow"></span>
      </d-button>
    </d-button-group>
    <ul dDropDownMenu class="devui-dropdown-menu" role="menu">
      <li role="menuitem" (click)="onBatchValid()">
        <a dDropDownMenuItem>
          <span class="icon-setup" style="padding-right: 5px; vertical-align: middle"> Valid</span>
        </a>
      </li>
      <li role="menuitem" (click)="onBatchTag()">
        <a dDropDownMenuItem>
          <span class="icon-tag" style="padding-right: 5px; vertical-align: middle"> Tag</span>
        </a>
      </li>
      <li role="menuitem" (click)="onBatchDelete()">
        <a dDropDownMenuItem>
          <span class="icon-delete" style="padding-right: 5px; vertical-align: middle"> Delete</span>
        </a>
      </li>
    </ul>
  </div>
  <d-pagination
    class="pagination"
    [total]="table.pager.total"
    [(pageSize)]="table.pager.pageSize"
    [(pageIndex)]="table.pager.pageIndex"
    [canViewTotal]="true"
    [canChangePageSize]="true"
    [maxItems]="5"
    (pageIndexChange)="pageIndexChange($event)"
    (pageSizeChange)="pageSizeChange($event)"
  >
  </d-pagination>
</div>
