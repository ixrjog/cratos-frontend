<div class="spacing-table">
  <d-data-table dLoading [loading]="loading"  [dataSource]="dataTable" [scrollable]="true"
                [tableOverflowType]="'overlay'">
    <d-column field="name" header="Name"></d-column>
    <d-column field="value" header="Value">
      <d-cell>
        <ng-template let-rowItem="rowItem">
          <ng-container *ngIf="isMultiValue(rowItem.name); else plainValue">
            <div class="val-line" *ngFor="let v of splitValue(rowItem.name, rowItem.value)">{{ v }}</div>
          </ng-container>
          <ng-template #plainValue>{{ rowItem.value }}</ng-template>
        </ng-template>
      </d-cell>
    </d-column>
<!--    <d-column field="comment" header="Comment"></d-column>-->
    <ng-template #noResultTemplateRef>
      <div class="no-data">Fetch Data</div>
    </ng-template>
  </d-data-table>
</div>
