<da-layout-row [daGutter]="[12, 12]">
  <da-col-item [daSpan]="24" [daXs]="24">
    <div class="app-data-table">
      <app-world-clock-display [title]="''"></app-world-clock-display>
    </div>
  </da-col-item>
  <da-col-item [daSpan]="24" [daXs]="24">
    <div class="app-data-table doc-panel">
      <div class="doc-layout">
        <div class="doc-logo">
          <img src="assets/cratos-logo.svg" alt="Cratos Logo" />
        </div>
        <div class="doc-md">
          <markdown src="assets/help.md" lineNumbers lineHighlight mermaid></markdown>
        </div>
      </div>
    </div>
  </da-col-item>
</da-layout-row>
