<div class="pw-tool">
  <div class="pw-tool-header">
    <a class="back-link" [routerLink]="['/pages', 'tools']">
      <i class="icon icon-go-back"></i> 返回工具箱
    </a>
    <h3>随机密码生成器</h3>
    <span class="subtitle">纯前端生成，使用加密安全随机数；密码不会离开浏览器</span>
  </div>

  <!-- 长度选择 -->
  <div class="length-bar">
    <span class="label">密码长度</span>
    <div class="preset-group">
      <button
        *ngFor="let n of lengthPresets"
        class="preset"
        [class.active]="!useCustom && length === n"
        (click)="selectPreset(n)"
      >{{ n }}</button>
      <button class="preset" [class.active]="useCustom" (click)="useCustom = true">自定义</button>
    </div>
    <span class="custom-input" *ngIf="useCustom">
      <input
        dTextInput
        type="number"
        min="4"
        max="256"
        [(ngModel)]="customLength"
        style="width: 100px;"
      />
      位
    </span>
  </div>

  <div class="action-bar">
    <d-button bsStyle="primary" (click)="generateAll()">生成密码</d-button>
    <span class="cur-len">当前长度：{{ effectiveLength }}</span>
  </div>

  <!-- 结果 -->
  <div class="results" *ngIf="results.length">
    <div class="pw-row" *ngFor="let item of results">
      <div class="pw-meta">
        <div class="pw-name">{{ item.type.name }}</div>
        <div class="pw-desc">{{ item.type.desc }}</div>
      </div>
      <div class="pw-value-line">
        <input class="pw-value" [value]="item.value" readonly spellcheck="false" />
        <d-button bsStyle="common" (click)="copy(item.value)">复制</d-button>
        <d-button bsStyle="text" (click)="regenerate(item)">换一个</d-button>
      </div>
    </div>
  </div>

  <div class="status">
    <span class="status-error" *ngIf="errorMsg">{{ errorMsg }}</span>
    <span class="status-ok" *ngIf="okMsg && !errorMsg">{{ okMsg }}</span>
  </div>
</div>
