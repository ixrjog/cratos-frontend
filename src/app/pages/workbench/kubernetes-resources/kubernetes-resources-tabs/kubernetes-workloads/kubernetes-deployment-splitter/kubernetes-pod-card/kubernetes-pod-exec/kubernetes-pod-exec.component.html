<section>
  <d-card style="padding: 5px 10px">
    <d-card-header style="position: relative;margin-bottom: 5px;height: 28px">
      <d-card-subtitle>
        <span class="font-color-name" style="height: 22px">{{ kubernetesPod.metadata.name }}</span>
        <span style="margin-left: 10px;">
          <d-tag
            [tag]="connectionStatus"
            [labelStyle]="connectionStatus === 'Connected' ? 'green-w98' : connectionStatus === 'Connecting' ? 'blue-w98' : 'red-w98'"
          ></d-tag>
        </span>
        <span style="position: absolute;right: 0;top: 0; display: flex; gap: 8px;">
          <d-button
            *ngIf="userScripts.length"
            bsStyle="text"
            (click)="openScriptPicker()"
          >
            <i class="icon icon-code" style="margin-right: 4px;"></i>{{ 'userScript.runScript' | translate }}
          </d-button>
          <d-button
            bsStyle="text"
            [disabled]="connectionStatus === 'Connected' || connectionStatus === 'Connecting'"
            (click)="onReconnect()"
          >Reconnect
          </d-button>
          <d-button
            bsStyle="text"
            (click)="onRowExit()"
          >{{ 'kubernetes.actions.exit' | translate }}
          </d-button>
        </span>
      </d-card-subtitle>
    </d-card-header>
    <d-card-content style="position: relative;">
      <div class="kubernetes-pod-exec" id="kubernetesPodExec" (window:resize)="onResize($event)"></div>
      <div class="script-picker-panel" *ngIf="showScriptPicker">
        <app-user-script-picker
          [scripts]="userScripts"
          [injectName]="kubernetesPod.metadata.name"
          [injectIp]="kubernetesPod.status.podIP"
          (pick)="onPickScript($event)"
          (pickAsScript)="onPickScriptAsFile($event)"
          (cancel)="closeScriptPicker()"
        ></app-user-script-picker>
      </div>
    </d-card-content>
  </d-card>
</section>
